name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pytest lets the generated ROS 2 behavior tests run; g++ is preinstalled
      - run: pip install pytest

      - run: pnpm install --frozen-lockfile

      - name: Unit & integration tests
        run: pnpm test

      - name: Type check
        run: pnpm typecheck

      - name: Production build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
